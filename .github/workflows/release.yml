name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect package.json version change
        id: version
        run: |
          NEW="$(node -p "require('./package.json').version")"
          OLD="$(git show HEAD^:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || true)"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ -n "$OLD" ] && [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.version.outputs.changed == 'true'
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.new }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping GitHub release."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Release $TAG — \`npm install -D eslint-config-narwhal@${{ steps.version.outputs.new }}\`." \
              --generate-notes
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        env:
          HUSKY: '0'
          # Optional fallback if Trusted Publishing is not configured yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
